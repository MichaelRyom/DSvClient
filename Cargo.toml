[package]
name = "DSvClient"
version = "0.4.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43.1", features = ["full"] }
hyper = { version = "1.0", features = ["full", "http1", "http2", "client"] }
hyper-util = { version = "0.1.11", features = ["full"] }
http-body-util = "0.1.3"
bytes = "1.10.1"
hyper-tls = "0.6.0"
url = "2.4.1"
quick-xml = { version = "0.37.4", features = ["async-tokio", "serialize", "serde"] }
csv = "1.3.1"
anyhow = "1.0.97"
futures = "0.3.31"
path-clean = "1.0.1"
zip = "2.6.1"
tokio-retry = "0.3.0"
log = "0.4.27"
simplelog = "0.12.2"
sha2 = "0.10.8"
rayon = "1.10.0"
num_cpus = "1.16.0"
async-trait = "0.1.88"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8.20"
