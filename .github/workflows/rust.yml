name: Rust

on:
  push:
    branches: [ "shit-dont-work" ]
  pull_request:
    branches: [ "shit-dont-work" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: BuildOnUbuntu
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
