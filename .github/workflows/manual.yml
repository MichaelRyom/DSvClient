# This is a basic workflow that is manually triggered

name: Manual Build

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      run_windows:
        description: 'Run Windows build'
        type: boolean
        default: true
      run_linux:
        description: 'Run Linux build'
        type: boolean
        default: false
      run_macos:
        description: 'Run macOS build'
        type: boolean
        default: false
      run_freebsd:
        description: 'Run FreeBSD build'
        type: boolean
        default: false
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'DSvC Build workflow'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: false
        # The data type of the input
        type: string

jobs:
  build-windows:
    if: ${{ github.event.inputs.run_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            # Windows specific paths
            C:/Users/runneradmin/.cargo/registry
            C:/Users/runneradmin/.cargo/git
            # Cache build artifacts
            target
            target/x86_64-pc-windows-msvc
            target/x86_64-pc-windows-msvc/release/deps
            target/x86_64-pc-windows-msvc/release/build
            target/x86_64-pc-windows-msvc/release/.fingerprint
            # Cache compiled dependencies
            target/release/deps
            target/release/.fingerprint
            # Cache registry
            C:/Users/runneradmin/.cargo/.crates.toml
            C:/Users/runneradmin/.cargo/.crates2.json
            C:/Users/runneradmin/.cargo/registry/index
            C:/Users/runneradmin/.cargo/registry/cache
          key: windows-cargo-all-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-cargo-all-v1-
            windows-cargo-all-

      - name: Cache custom tools (Windows)
        uses: actions/cache@v3
        id: custom-tools-cache
        with:
          path: |
            C:/tools
            C:/ProgramData/chocolatey/lib/dos2unix
            ~/.cargo/bin/sccache
            C:/Users/runneradmin/.cargo/bin/sccache
            C:/Users/runneradmin/.cargo/config.toml
          key: windows-custom-tools-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure Cargo
        if: steps.custom-tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo install sccache
          # Disable incremental compilation when using sccache
          echo "CARGO_INCREMENTAL=0" >> $env:GITHUB_ENV
          echo "CARGO_NET_RETRY=10" >> $env:GITHUB_ENV
          echo "CARGO_BUILD_TARGET_DIR=target" >> $env:GITHUB_ENV
          # Add cache configuration
          $cargoConfig = @"
          [build]
          target-dir = "target"
          [net]
          retry = 10
          "@
          New-Item -Path "$env:USERPROFILE\.cargo" -ItemType Directory -Force
          Set-Content -Path "$env:USERPROFILE\.cargo\config.toml" -Value $cargoConfig

      - name: Cache vcpkg (Windows)
        uses: actions/cache@v3
        with:
          path: C:/vcpkg/installed
          key: windows-vcpkg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-vcpkg-

      - name: Download custom tools (Windows)
        if: steps.custom-tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/tools")){
            New-Item -Path "C:/tools" -ItemType Directory -force
          }
          choco install dos2unix 7zip.install -y --no-progress --debug --verbose
          # Copy directly from chocolatey shim location
          #Get-childitem "C:/ProgramData/chocolatey/lib/dos2unix/tools/" -recurse
          Copy-Item "C:/ProgramData/chocolatey/lib/dos2unix/tools/bin/dos2unix.exe" -Destination "C:/tools/"
          Copy-Item "C:/ProgramData/chocolatey/lib/dos2unix/tools/bin/unix2dos.exe" -Destination "C:/tools/"

      - name: Add tools to PATH (Windows)
        shell: pwsh
        run: |
          echo "C:/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: C:/Users/runneradmin/.rustup
          key: windows-rustup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-rustup-

      - name: Install Dependencies (Windows)
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: x86_64-pc-windows-msvc
          args: "--locked --release"
          strip: false  # Disable stripping in cross action

      - name: Strip Binary (Windows)
        shell: pwsh
        run: |
          $binPath = "target/x86_64-pc-windows-msvc/release/vmware-downloader.exe"
          if (Test-Path $binPath) {
            copy-item $binPath "$binPath.unstripped"
            $vsDevCmd = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "**\vcvarsall.bat"
            cmd /c "`"$vsDevCmd`" amd64 && dumpbin /headers $binPath | findstr 'debug'"
            cmd /c "`"$vsDevCmd`" amd64 && editbin /INCREMENTAL:NO $binPath"
          }

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          profile: minimal
          override: true

      - name: Publish Release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: x86_64-pc-windows-msvc
          changes-file: Changes.md

  build-ubuntu:
    if: ${{ github.event.inputs.run_linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            key: linux-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            linux-cargo-

      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: ~/.rustup
          key: linux-rustup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-rustup-

      - name: Install Dependencies (Linux)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          # Set OpenSSL paths for Linux
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/openssl" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: x86_64-unknown-linux-gnu
          args: "--locked --release"
          strip: true

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          profile: minimal
          override: true

      - name: Publish Release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: x86_64-unknown-linux-gnu
          changes-file: Changes.md

  build-macos:
    if: ${{ github.event.inputs.run_macos == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            macos-cargo-

      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: ~/.rustup
          key: macos-rustup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-rustup-

      - name: Install Dependencies (macOS)
        shell: bash
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: x86_64-apple-darwin
          args: "--locked --release"
          strip: true

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
          profile: minimal
          override: true

      - name: Publish Release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: x86_64-apple-darwin
          changes-file: Changes.md

  build-freebsd:
    if: ${{ github.event.inputs.run_freebsd == 'true' }}
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: freebsd-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            freebsd-cargo-

      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: ~/.rustup
          key: freebsd-rustup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: freebsd-rustup-

      - name: Cache cross compiled artifacts (FreeBSD)
        uses: actions/cache@v3
        with:
          path: target/x86_64-unknown-freebsd
          key: freebsd-cargo-compiled-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: freebsd-cargo-compiled-

      - name: Cache cross Docker image
        uses: actions/cache@v3
        id: cached-image
        with:
          path: ${{ runner.temp }}/freebsd-cross.tar
          key: freebsd-cross-${{ hashFiles('**/Cargo.lock') }}

      - name: Load cross Docker image
        if: steps.cached-image.outputs.cache-hit == 'true'
        run: docker load -i $RUNNER_TEMP/freebsd-cross.tar

      - name: Pull and Save cross Docker image
        if: steps.cached-image.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/cross-rs/x86_64-unknown-freebsd:0.2.5
          docker save ghcr.io/cross-rs/x86_64-unknown-freebsd:0.2.5 -o $RUNNER_TEMP/freebsd-cross.tar

      - name: Cache apt packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: freebsd-apt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: freebsd-apt-

      - name: Setup Build Environment
        run: |
          # Remove old references
          echo "Skipping manual FreeBSD libraries..."
          sudo rm -rf /usr/local/freebsd
          sudo rm -rf /usr/cross/freebsd

          # Create cache directory if it doesn't exist
          mkdir -p ~/.cache/cross-rs

          # Only install the Rust target
          rustup target add x86_64-unknown-freebsd
        shell: bash

      - name: Install Dependencies (FreeBSD)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: x86_64-unknown-freebsd
          args: "--locked --release"
          strip: true

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-freebsd
          profile: minimal
          override: true

      - name: Publish Release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: x86_64-unknown-freebsd
          changes-file: Changes.md
