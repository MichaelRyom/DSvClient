# This is a basic workflow that is manually triggered

name: Manual Build

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'DSvC Build workflow'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: false
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  release:
    name: Release - ${{ matrix.os-name }}
    strategy:
      fail-fast: false  # Don't fail fast to see all build issues
      matrix:
        include:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-20.04
            skip: true
            target: x86_64-unknown-freebsd
            setup: |
              # Remove old references
              echo "Skipping manual FreeBSD libraries..."
              sudo rm -rf /usr/local/freebsd
              sudo rm -rf /usr/cross/freebsd

              # Create cache directory if it doesn't exist
              mkdir -p ~/.cache/cross-rs

              # Only install the Rust target
              rustup target add x86_64-unknown-freebsd

          - os-name: Linux-x86_64
            runs-on: ubuntu-latest
            skip: true
            target: x86_64-unknown-linux-gnu

          - os-name: Windows-x86_64
            runs-on: windows-latest
            skip: false
            target: x86_64-pc-windows-msvc

          - os-name: macOS-x86_64
            runs-on: macos-latest
            skip: true
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runs-on }}
    env:
      OPENSSL_STATIC: true
      PKG_CONFIG_ALLOW_CROSS: "1"
      OPENSSL_DIR: ${{ matrix.os-name == 'Windows-x86_64' && 'C:/vcpkg/installed/x64-windows-static' || '/usr/lib/ssl' }}

    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo Dependencies
        if: matrix.skip == false
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            # Windows specific paths
            C:/Users/runneradmin/.cargo/registry
            C:/Users/runneradmin/.cargo/git
            # Cache build artifacts
            target/x86_64-pc-windows-msvc/release/deps
            target/x86_64-pc-windows-msvc/release/build
            target/x86_64-pc-windows-msvc/release/.fingerprint
            # Cache compiled dependencies
            target/release/deps
            target/release/.fingerprint
            # Cache registry
            C:/Users/runneradmin/.cargo/.crates.toml
            C:/Users/runneradmin/.cargo/.crates2.json
            C:/Users/runneradmin/.cargo/registry/index
            C:/Users/runneradmin/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Configure Cargo
        if: runner.os == 'Windows' && matrix.skip == false
        shell: pwsh
        run: |
          cargo install sccache
          # Disable incremental compilation when using sccache
          echo "CARGO_INCREMENTAL=0" >> $env:GITHUB_ENV
          # Remove RUSTC_WRAPPER as it's causing issues
          # echo "RUSTC_WRAPPER=$(where.exe sccache)" >> $env:GITHUB_ENV
          echo "CARGO_NET_RETRY=10" >> $env:GITHUB_ENV
          echo "CARGO_BUILD_TARGET_DIR=target" >> $env:GITHUB_ENV
          # Add cache configuration
          $cargoConfig = @"
          [build]
          target-dir = "target"
          [net]
          retry = 10
          "@
          New-Item -Path "$env:USERPROFILE\.cargo" -ItemType Directory -Force
          Set-Content -Path "$env:USERPROFILE\.cargo\config.toml" -Value $cargoConfig

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Cache custom tools (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        uses: actions/cache@v3
        id: custom-tools-cache  # Add ID to check cache status
        with:
          path: |
            C:/tools
            C:/ProgramData/chocolatey/lib/dos2unix
          key: ${{ runner.os }}-custom-tools-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Download custom tools (Windows)
        if: runner.os == 'Windows' && matrix.skip == false && steps.custom-tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/tools")){
            New-Item -Path "C:/tools" -ItemType Directory -force
          }
          choco install dos2unix 7zip.install -y --no-progress --debug --verbose
          # Copy directly from chocolatey shim location
          #Get-childitem "C:/ProgramData/chocolatey/lib/dos2unix/tools/" -recurse
          Copy-Item "C:/ProgramData/chocolatey/lib/dos2unix/tools/bin/dos2unix.exe" -Destination "C:/tools/"
          Copy-Item "C:/ProgramData/chocolatey/lib/dos2unix/tools/bin/unix2dos.exe" -Destination "C:/tools/"

      - name: Add tools to PATH (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        shell: pwsh
        run: |
          echo "C:/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust toolchain
        if: matrix.skip == false
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && 'C:/Users/runneradmin/.rustup' || '~/.rustup' }}
          key: ${{ runner.os }}-rustup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rustup-

      - name: Cache cross compiled artifacts (FreeBSD)
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: target/x86_64-unknown-freebsd
          key: ${{ matrix.os-name }}-freebsd-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os-name }}-freebsd-cargo-

      - name: Cache cross Docker image
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        id: cached-image
        with:
          path: ${{ runner.temp }}/freebsd-cross.tar
          key: freebsd-cross-${{ hashFiles('**/Cargo.lock') }}

      - name: Load cross Docker image
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false && steps.cached-image.outputs.cache-hit == 'true'
        run: docker load -i $RUNNER_TEMP/freebsd-cross.tar

      - name: Pull and Save cross Docker image
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false && steps.cached-image.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/cross-rs/x86_64-unknown-freebsd:0.2.5
          docker save ghcr.io/cross-rs/x86_64-unknown-freebsd:0.2.5 -o $RUNNER_TEMP/freebsd-cross.tar

      - name: Cache Windows compiled artifacts
        if: runner.os == 'Windows' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: target/x86_64-pc-windows-msvc
          key: ${{ runner.os }}-win-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-win-cargo-

      - name: Cache apt packages
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: freebsd-apt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: freebsd-apt-

      - name: Setup Build Environment
        if: matrix.setup != '' && matrix.skip == false
        run: ${{ matrix.setup }}
        shell: bash

      # Windows specific step
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      # macOS specific step
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS' && matrix.skip == false
        shell: bash
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV

      # Linux specific step
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux' && matrix.skip == false
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          # Set OpenSSL paths for Linux
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/openssl" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV

      - name: Install Dependencies (FreeBSD)
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        if: matrix.skip == false
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Install Rust toolchain
        if: matrix.skip == false
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          profile: minimal
          override: true

      - name: Publish Release
        if: matrix.skip == false
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: ${{ matrix.target }}
          changes-file: Changes.md
