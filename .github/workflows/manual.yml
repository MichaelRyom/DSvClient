# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'DSvC Build workflow'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  release:
    name: Release - ${{ matrix.os-name }}
    strategy:
      matrix:
        os-name: [FreeBSD-x86_64, Linux-x86_64, Linux-aarch64, Linux-riscv64, Windows-x86_64, macOS-x86_64]
        include:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-20.04
            target: x86_64-unknown-freebsd
            skip_tests: true
            setup: |
              sudo apt-get update
              sudo apt-get install -y pkg-config musl-tools
              sudo ln -s /usr/bin/musl-gcc /usr/local/bin/x86_64-unknown-freebsd-gcc

          - os-name: Linux-x86_64
            runs-on: ubuntu-20.04
            target: x86_64-unknown-linux-musl
            setup: |
              sudo apt-get update
              sudo apt-get install -y pkg-config musl-tools libssl-dev
              sudo ln -s /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

          - os-name: Linux-aarch64
            runs-on: ubuntu-20.04
            target: aarch64-unknown-linux-musl
            setup: |
              sudo apt-get update
              sudo apt-get install -y pkg-config musl-tools gcc-aarch64-linux-gnu libssl-dev
              sudo ln -s /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/aarch64-linux-musl-gcc

          - os-name: Linux-riscv64
            runs-on: ubuntu-20.04
            target: riscv64gc-unknown-linux-gnu
            setup: |
              sudo apt-get update
              sudo apt-get install -y pkg-config gcc-riscv64-linux-gnu libssl-dev

    runs-on: ${{ matrix.runs-on }}
    env:
      OPENSSL_STATIC: true
      OPENSSL_DIR: /usr
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: ${{ matrix.setup }}
        shell: bash

      - name: Set cross compilation environment
        run: |
          echo "CROSS_COMPILE=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        shell: bash

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true
      - name: Publish artifacts and release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: ubi
          target: ${{ matrix.target }}
