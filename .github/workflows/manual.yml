# This is a basic workflow that is manually triggered

name: Manual Build

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'DSvC Build workflow'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: false
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  release:
    name: Release - ${{ matrix.os-name }}
    strategy:
      fail-fast: false  # Don't fail fast to see all build issues
      matrix:
        include:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-20.04
            target: x86_64-unknown-freebsd
            setup: |
              # Remove any leftover old freebsd12 libraries
              sudo find /usr/local -name '*freebsd12*' -exec rm -rf {} \; || true

              # Install build tools
              sudo apt-get update
              sudo apt-get install -y \
                gcc-multilib \
                pkg-config \
                libbsd-dev \
                crossbuild-essential-amd64 \
                g++-x86-64-linux-gnu

              # Setup FreeBSD environment
              wget https://download.freebsd.org/ftp/releases/amd64/14.2-RELEASE/base.txz
              sudo mkdir -p /usr/local/freebsd
              sudo tar xf base.txz -C /usr/local/freebsd

              # Clean up thoroughly
              sudo rm -rf /usr/local/x86_64-unknown-freebsd12
              sudo rm -rf /usr/local/x86_64-unknown-freebsd
              sudo rm -rf /usr/x86_64-unknown-freebsd

              # Create isolated library directories (changed paths)
              sudo mkdir -p /usr/cross/freebsd/lib
              sudo mkdir -p /usr/cross/freebsd/usr/lib

              # Copy FreeBSD system libraries to isolated location
              echo "Copying system libraries..."
              sudo cp -P /usr/local/freebsd/lib/libc.* /usr/cross/freebsd/lib/
              sudo cp -P /usr/local/freebsd/lib/lib*.so* /usr/cross/freebsd/lib/

              # Remove the loop for execinfo, procstat, devstat, kvm, memstat
              echo "Skipping problematic libraries..."

              # Copy remaining static libraries
              sudo find /usr/local/freebsd/lib -type f -name "*.a" -exec cp -v {} /usr/cross/freebsd/lib/ \; || true
              sudo find /usr/local/freebsd/usr/lib -type f -name "*.a" -exec cp -v {} /usr/cross/freebsd/usr/lib/ \; || true

              # Fix permissions
              sudo chown -R $(id -u):$(id -g) /usr/cross
              sudo chmod -R 755 /usr/cross

              # Set environment variables with isolated paths
              echo "CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER=x86_64-linux-gnu-gcc" >> $GITHUB_ENV
              echo "CC_x86_64_unknown_freebsd=x86_64-linux-gnu-gcc" >> $GITHUB_ENV
              echo "PKG_CONFIG_PATH=/usr/cross/freebsd/lib/pkgconfig" >> $GITHUB_ENV

              # Remove explicit RUSTFLAGS so we rely on the default
              echo "Removing custom link args..."
              sed -i '/RUSTFLAGS=/d' $GITHUB_ENV

              # Debug: List all libraries
              echo "Library contents:"
              find /usr/cross/freebsd -type f -name "lib*"

              # Install Rust target
              rustup target add x86_64-unknown-freebsd

          - os-name: Linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

          - os-name: macOS-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runs-on }}
    env:
      OPENSSL_STATIC: true
      PKG_CONFIG_ALLOW_CROSS: "1"
      OPENSSL_DIR: ${{ matrix.os-name == 'Windows-x86_64' && 'C:/vcpkg/installed/x64-windows-static' || '/usr/lib/ssl' }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Build Environment
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
        shell: bash

      # Windows specific step
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      # macOS specific step
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV

      # Linux specific step
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          # Set OpenSSL paths for Linux
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/openssl" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV

      - name: Configure build environment
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        shell: bash

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Publish Release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: ${{ matrix.target }}
          changes-file: Changes.md
