# This is a basic workflow that is manually triggered

name: Manual Build

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'DSvC Build workflow'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: false
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  release:
    name: Release - ${{ matrix.os-name }}
    strategy:
      fail-fast: false  # Don't fail fast to see all build issues
      matrix:
        include:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-20.04
            skip: false
            target: x86_64-unknown-freebsd
            setup: |
              # Remove old references
              echo "Skipping manual FreeBSD libraries..."
              sudo rm -rf /usr/local/freebsd
              sudo rm -rf /usr/cross/freebsd

              # Create cache directory if it doesn't exist
              mkdir -p ~/.cache/cross-rs

              # Check if we have a cached API response
              if [ ! -f ~/.cache/cross-rs/latest.json ]; then
                curl -sL https://api.github.com/repos/cross-rs/cross/releases/latest > ~/.cache/cross-rs/latest.json
              fi

              # Only install the Rust target
              rustup target add x86_64-unknown-freebsd

          - os-name: Linux-x86_64
            runs-on: ubuntu-latest
            skip: true
            target: x86_64-unknown-linux-gnu

          - os-name: Windows-x86_64
            runs-on: windows-latest
            skip: false
            target: x86_64-pc-windows-msvc

          - os-name: macOS-x86_64
            runs-on: macos-latest
            skip: true
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runs-on }}
    env:
      OPENSSL_STATIC: true
      PKG_CONFIG_ALLOW_CROSS: "1"
      OPENSSL_DIR: ${{ matrix.os-name == 'Windows-x86_64' && 'C:/vcpkg/installed/x64-windows-static' || '/usr/lib/ssl' }}

    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo Dependencies
        if: matrix.skip == false
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Cache custom tools (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: C:/tools
          key: ${{ runner.os }}-custom-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-custom-tools-

      - name: Download custom tools (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/tools")){
            New-Item -Path "C:/tools" -ItemType Directory -force}
          if (-not (Test-Path "C:/tools/dos2unix.exe")) {
            choco install dos2unix -y 
            Move-Item -Path "C:/ProgramData/chocolatey/lib/dos2unix/tools/dos2unix.exe" -Destination "C:/tools/dos2unix.exe"
          }
          if (-not (Test-Path "C:/tools/psutils.zip")) {
            Invoke-WebRequest -Uri "https://github.com/lukesampson/psutils/archive/master.zip" -OutFile "C:/tools/psutils.zip"
          }

      - name: Cache Rust toolchain
        if: matrix.skip == false
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && 'C:/Users/runneradmin/.rustup' || '~/.rustup' }}
          key: ${{ runner.os }}-rustup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rustup-

      - name: Cache cross compiled artifacts (FreeBSD)
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: target/x86_64-unknown-freebsd
          key: ${{ matrix.os-name }}-freebsd-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os-name }}-freebsd-cargo-

      - name: Cache cross-rs cache (FreeBSD)
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: ~/.cargo/.cache/cross
          key: ${{ matrix.os-name }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os-name }}-cross-

      - name: Cache cross binary (FreeBSD)
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cross
          key: ${{ matrix.os-name }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os-name }}-cross-

      - name: Cache cross-rs API response
        if: matrix.os-name == 'FreeBSD-x86_64' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: ~/.cache/cross-rs
          key: cross-rs-api-${{ github.sha }}
          restore-keys: |
            cross-rs-api-

      - name: Cache Windows compiled artifacts
        if: runner.os == 'Windows' && matrix.skip == false
        uses: actions/cache@v3
        with:
          path: target/x86_64-pc-windows-msvc
          key: ${{ runner.os }}-win-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-win-cargo-

      - name: Setup Build Environment
        if: matrix.setup != '' && matrix.skip == false
        run: ${{ matrix.setup }}
        shell: bash

      # Windows specific step
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows' && matrix.skip == false
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      # macOS specific step
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS' && matrix.skip == false
        shell: bash
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV

      # Linux specific step
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux' && matrix.skip == false
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          # Set OpenSSL paths for Linux
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/openssl" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV

      - name: Create Changes.md
        run: |
          echo "# Changelog" > Changes.md
          echo "## v0.1.0" >> Changes.md
          echo "* Initial release" >> Changes.md
        shell: bash

      - name: Build Release
        if: matrix.skip == false
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Publish Release
        if: matrix.skip == false
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: vmware-downloader
          target: ${{ matrix.target }}
          changes-file: Changes.md
